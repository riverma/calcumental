name: mental_math
description: Arithmetic puzzles to play at your own pace. Offline, on your own device, with nothing counted and nothing kept but your settings.
publish_to: none
version: 1.1.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  # Every dependency is permissive (BSD or MIT) and none of them phones home.
  # tool/check_licenses.dart enforces the first; tool/check_offline.dart the second.
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  crypto: ^3.0.7
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/icons/
  fonts:
    # Khelo's three faces, SIL OFL 1.1 (assets/fonts/OFL-*.txt). Each covers Latin and
    # Devanagari, so Hindi is set in the same hand as English.
    - family: Rozha One
      fonts:
        - asset: assets/fonts/RozhaOne-Regular.ttf
    - family: Yatra One
      fonts:
        - asset: assets/fonts/YatraOne-Regular.ttf
    - family: Baloo 2
      fonts:
        - asset: assets/fonts/Baloo2-VariableFont.ttf
