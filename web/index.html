<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <!-- No maximum-scale, no user-scalable=no: pinch zoom stays. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--
    Calcumental makes no network requests beyond its own files, and this policy makes that a
    rule rather than a habit. connect-src is 'self' because Flutter fetches its own engine,
    fonts and assets; every one of them is served from here.
      'wasm-unsafe-eval': the CanvasKit renderer is WebAssembly.
      blob: in worker-src: the renderer's worker.
    No inline script: Flutter's loader and engine are files served from here.
    The Donate and Privacy links are navigations the person chooses, which CSP does not gate.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self' blob: data:; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'">
  <title>Calcumental</title>
  <meta name="description" content="Arithmetic puzzles to play at your own pace. Offline, on your own device, with nothing counted and nothing kept but your settings.">
  <meta name="theme-color" content="#fbf0d9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14103a" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Calcumental">
  <link rel="apple-touch-icon" href="icons/Icon-180.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #fbf0d9; }
    @media (prefers-color-scheme: dark) { html, body { background: #14103a; } }
  </style>
</head>
<body>
  <noscript>Calcumental needs JavaScript to run. It still sends nothing anywhere: everything happens on this device.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
